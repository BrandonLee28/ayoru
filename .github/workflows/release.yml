name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: aarch64
            target: aarch64-apple-darwin
            asset_name: ayoru-darwin-aarch64.tar.gz
          - os: macos-15-intel
            arch: x86_64
            target: x86_64-apple-darwin
            asset_name: ayoru-darwin-x86_64.tar.gz

    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92
      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Check and test
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          sh tests/install_script.sh
          sh tests/release_workflow.sh
          sh tests/native_macos.sh
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package desktop app and DMG
        run: sh scripts/package-macos.sh "target/${{ matrix.target }}/release/ayoru" dist "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            dist/*.tar.gz
            dist/*.dmg
          if-no-files-found: error

  publish_alpha:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: alpha
          name: alpha
          prerelease: true
          make_latest: false
          files: |
            dist/*.tar.gz
            dist/*.dmg
          fail_on_unmatched_files: true
          overwrite_files: true

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.dmg
          fail_on_unmatched_files: true
